<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>i2i Academy — Containerization</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #1e3a8a 0%, #0ea5e9 100%);
      color: #0f172a;
    }
    .card {
      background: #ffffff;
      padding: 3rem 3.5rem;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
      text-align: center;
      max-width: 560px;
    }
    .badge {
      display: inline-block;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #0ea5e9;
      font-weight: 700;
      margin-bottom: 1rem;
    }
    h1 { font-size: 1.9rem; line-height: 1.3; margin-bottom: 1rem; }
    p { color: #475569; font-size: 1.05rem; line-height: 1.6; }
    .stack { margin-top: 1.75rem; font-size: 0.9rem; color: #64748b; }
    .stack span {
      display: inline-block;
      background: #f1f5f9;
      border-radius: 999px;
      padding: 0.35rem 0.9rem;
      margin: 0.2rem;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">i2i Academy · Containerization</div>
    <h1>Hello from i2i Academy Docker Container!</h1>
    <p>This static page is served by an Nginx container orchestrated with Docker Compose.</p>
    <div class="stack">
      <span>Docker</span>
      <span>Docker Compose</span>
      <span>Nginx</span>
    </div>
  </main>
</body>
</html>
